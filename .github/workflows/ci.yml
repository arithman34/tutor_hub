name: CI

on:
  pull_request:
  workflow_call:

jobs:
  # The FastAPI app (app/) is retired — nothing deploys it anymore — so it no
  # longer has a CI job gating deploys. The code and its tests still live in
  # the repo for reference; run them locally with `pytest` if needed.
  test-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django_app/requirements.txt

      - name: Install dependencies
        working-directory: django_app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: django_app
        run: python manage.py test
