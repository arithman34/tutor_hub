name: CI

on:
  pull_request:
  workflow_call:

jobs:
  # The FastAPI app (app/) is retired — nothing deploys it anymore — so it no
  # longer has a CI job gating deploys. The code and its tests still live in
  # the repo for reference; run them locally with `pytest` if needed.
  test-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django_app/requirements.txt

      - name: Install dependencies
        working-directory: django_app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: django_app
        run: python manage.py test

      # The React app's TypeScript types are generated from spa/openapi.yaml.
      # Fail if an endpoint can't be described, or if the committed schema is
      # out of date (fix: run the spectacular command below and commit it).
      - name: Check OpenAPI schema
        working-directory: django_app
        run: |
          python manage.py spectacular --validate --fail-on-warn --file spa/openapi.yaml
          git diff --exit-code spa/openapi.yaml

  # Catches a broken Tailwind build on the PR rather than in the deploy's
  # docker build.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: django_app/package-lock.json

      - name: Install dependencies
        working-directory: django_app
        run: npm ci

      - name: Build CSS and vendor JS
        working-directory: django_app
        run: npm run build

  # The React app: types match the schema, then lint, type-check, test, build.
  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_app/spa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: django_app/spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check API types match the schema
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
