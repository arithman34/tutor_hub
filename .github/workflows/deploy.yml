name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # required for OIDC auth to AWS
      contents: read
    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: tutorhub
      ECS_CLUSTER: tutorhub-lean
      ECS_SERVICE: app
      TASK_FAMILY: tutorhub-lean-app

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Each deploy registers a new task definition revision pinned to this
      # commit's image rather than :latest. If the new task fails to start or
      # fails its health check, the ECS deployment circuit breaker rolls the
      # service back to the previous revision, which still points at the last
      # good image.
      - name: Register task definition
        id: taskdef
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition \
            | jq --arg image "$IMAGE" '
                .containerDefinitions |= map(if (.name | IN("api", "worker", "beat")) then .image = $image else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' \
            > task-definition.json
          arn=$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait for rollout
        env:
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" --no-cli-pager --query 'service.serviceName' --output text

          if ! aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"; then
            echo "::error::Service did not stabilise. The circuit breaker rolls back to the previous revision once enough tasks fail."
            exit 1
          fi

          # A rolled-back deployment also ends up stable, so check which
          # revision the service actually settled on.
          running=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ "$running" != "$TASK_DEFINITION" ]; then
            echo "::error::Deployment of $TASK_DEFINITION failed and ECS rolled back to $running."
            exit 1
          fi
