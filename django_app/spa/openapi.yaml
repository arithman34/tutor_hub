components:
  schemas:
    Allowance:
      type: object
      properties:
        limit:
          type: integer
          nullable: true
          description: Questions per day (UK time). Null means unlimited.
        used:
          type: integer
        remaining:
          type: integer
          nullable: true
        unlimited:
          type: boolean
        exhausted:
          type: boolean
      required:
      - exhausted
      - limit
      - remaining
      - unlimited
      - used
    Answer:
      type: object
      properties:
        reply:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        allowance:
          $ref: '#/components/schemas/Allowance'
      required:
      - allowance
      - history
      - reply
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - question
    AxisEnum:
      enum:
      - y
      - y1
      type: string
      description: |-
        * `y` - y
        * `y1` - y1
    CalendarEvent:
      type: object
      description: An event on the Tutoring calendar, flattened by services.parse_event.
      properties:
        event_id:
          type: string
        summary:
          type: string
        student_name:
          type: string
        date:
          type: string
          description: YYYY-MM-DD
        start_time:
          type: string
          description: HH:MM, blank for all-day events
        end_time:
          type: string
          description: HH:MM, blank for all-day events
        all_day:
          type: boolean
        html_link:
          type: string
      required:
      - all_day
      - date
      - end_time
      - event_id
      - html_link
      - start_time
      - student_name
      - summary
    CalendarSessionItem:
      type: object
      description: An event on the Tutoring calendar, flattened by services.parse_event.
      properties:
        event_id:
          type: string
        summary:
          type: string
        student_name:
          type: string
        date:
          type: string
          description: YYYY-MM-DD
        start_time:
          type: string
          description: HH:MM, blank for all-day events
        end_time:
          type: string
          description: HH:MM, blank for all-day events
        all_day:
          type: boolean
        html_link:
          type: string
        logged:
          type: boolean
          description: Whether a Session has been logged for this event.
        session_id:
          type: string
          format: uuid
          nullable: true
        student_id:
          type: string
          format: uuid
          nullable: true
          description: The active student the event title matches, if any.
      required:
      - all_day
      - date
      - end_time
      - event_id
      - html_link
      - logged
      - session_id
      - start_time
      - student_id
      - student_name
      - summary
    CalendarSessions:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarSessionItem'
        error:
          type: string
          nullable: true
          description: Set when Google Calendar couldn't be reached.
      required:
      - error
      - items
    ConnectUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Google's consent page. Send the browser here.
      required:
      - url
    ConnectionStatus:
      type: object
      properties:
        connected:
          type: boolean
      required:
      - connected
    Conversation:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        allowance:
          $ref: '#/components/schemas/Allowance'
        examples:
          type: array
          items:
            type: string
          description: Suggested first questions.
        max_question_length:
          type: integer
      required:
      - allowance
      - examples
      - history
      - max_question_length
    CookieLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Dashboard:
      type: object
      description: Headline numbers from analytics.dashboard.get_dashboard_stats.
      properties:
        revenue_alltime:
          type: number
          format: double
        revenue_this_month:
          type: number
          format: double
        revenue_this_year:
          type: number
          format: double
        mom_trend:
          type: number
          format: double
          nullable: true
          description: Revenue percent change against last month.
        outstanding_total:
          type: number
          format: double
          description: Total owed by payees in arrears.
        outstanding_payees:
          type: integer
        active_students:
          type: integer
        sessions_this_week:
          type: integer
          description: Sessions in the last 7 days.
        sessions_this_month:
          type: integer
        sessions_pct_change:
          type: number
          format: double
          nullable: true
        hours_this_month:
          type: number
          format: double
        hours_pct_change:
          type: number
          format: double
          nullable: true
      required:
      - active_students
      - hours_pct_change
      - hours_this_month
      - mom_trend
      - outstanding_payees
      - outstanding_total
      - revenue_alltime
      - revenue_this_month
      - revenue_this_year
      - sessions_pct_change
      - sessions_this_month
      - sessions_this_week
    DataImportRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    DayConfigRequest:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 6
          minimum: 0
          description: 0 = Monday, 6 = Sunday
        start:
          type: string
          minLength: 1
          description: HH:MM
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        end:
          type: string
          minLength: 1
          description: HH:MM
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
      required:
      - end
      - start
      - weekday
    FilterOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    FilterOptions:
      type: object
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        payees:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
      required:
      - payees
      - students
    ImportCounts:
      type: object
      properties:
        payees:
          type: integer
        students:
          type: integer
        sessions:
          type: integer
        payments:
          type: integer
      required:
      - payees
      - payments
      - sessions
      - students
    Message:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
      required:
      - content
      - role
    OneOffEventRequest:
      type: object
      description: |-
        What every booking takes: who it's for, and where.

        Needs the request in its context, to look the student up among the user's own.
      properties:
        student_id:
          type: string
          format: uuid
          description: The student the lesson is for. The event is titled '<first
            name> - Tuition', the format the sessions list matches students by.
        summary:
          type: string
          minLength: 1
          description: The event title, when no student_id is given.
          maxLength: 255
        location:
          type: string
          nullable: true
          description: Defaults to your tutoring address. Send null or blank for no
            location.
          maxLength: 500
        date:
          type: string
          format: date
        start_time:
          type: string
          minLength: 1
          description: HH:MM
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        end_time:
          type: string
          minLength: 1
          description: HH:MM
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
      required:
      - date
      - end_time
      - start_time
    PaginatedPaymentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    PaginatedSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    PatchedPayeeRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          maxLength: 50
        bank_reference_pattern:
          type: string
          nullable: true
          maxLength: 255
    PatchedPaymentRequest:
      type: object
      properties:
        payee:
          type: string
