openapi: 3.0.3
info:
  title: TutorHub API
  version: 1.0.0
  description: Students, sessions, billing, calendar and analytics for an independent
    tutor.
paths:
  /api/v1/analytics/dashboard:
    get:
      operationId: analytics_dashboard_retrieve
      summary: Headline numbers for the dashboard
      tags:
      - analytics
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/analytics/filters:
    get:
      operationId: analytics_filters_retrieve
      summary: Students and payees for the filter bar
      tags:
      - analytics
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
          description: ''
  /api/v1/analytics/trends:
    get:
      operationId: analytics_trends_retrieve
      summary: Charts for the analytics page
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
          nullable: true
      - in: query
        name: granularity
        schema:
          type: string
          minLength: 1
          default: month
        description: day, week or month. Coarsened automatically for long ranges.
      - in: query
        name: payee_id
        schema:
          type: string
          format: uuid
          nullable: true
      - in: query
        name: range
        schema:
          type: string
          minLength: 1
          default: 12m
        description: 3m, 6m, 12m, ytd or all. Unknown values fall back to 12m.
      - in: query
        name: start
        schema:
          type: string
          format: date
          nullable: true
        description: With end, overrides range.
      - in: query
        name: student_id
        schema:
          type: string
          format: uuid
          nullable: true
      tags:
      - analytics
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trends'
          description: ''
  /api/v1/assistant/:
    get:
      operationId: assistant_retrieve
      summary: The current conversation and today's allowance
      tags:
      - assistant
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/v1/assistant/ask:
    post:
      operationId: assistant_ask_create
      summary: Ask TutorHub AI a question
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
          description: ''
        '429':
          description: Today's question allowance is used up.
        '502':
          description: The AI provider failed. The question wasn't charged.
  /api/v1/assistant/reset:
    post:
      operationId: assistant_reset_create
      summary: Start a new conversation
      tags:
      - assistant
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/cookie/login:
    post:
      operationId: auth_cookie_login_create
      summary: Log in with httponly cookies
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CookieLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CookieLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/cookie/logout:
    post:
      operationId: auth_cookie_logout_create
      summary: Log out and clear the cookies
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/cookie/refresh:
    post:
      operationId: auth_cookie_refresh_create
      description: Swaps the refresh_token cookie for a new access/refresh pair. Call
        it after a 401, then retry the request.
      summary: Refresh the cookie tokens
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie and returns the same token. Send it as
        the X-CSRFToken header on cookie-authenticated POST, PUT, PATCH and DELETE
        requests.
      summary: Get a CSRF token
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: The signed-in user
      tags:
      - auth
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Update your details
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password:
    post:
      operationId: auth_password_create
      description: Signs out every other session by blacklisting all of the account's
        refresh tokens, then sets fresh auth cookies for this one.
      summary: Change your password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/calendar/callback:
    get:
      operationId: calendar_callback_retrieve
      description: Not called directly. Google sends the browser here, and it redirects
        on to the frontend.
      summary: Google's OAuth redirect target
      tags:
      - calendar
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/calendar/connect:
    get:
      operationId: calendar_connect_retrieve
      description: |-
        Returns the Google OAuth URL for the frontend to redirect the browser to.

        The CSRF `state` isn't a server-side session cookie (this API is JWT-only,
        and the browser hop to Google and back can't carry an Authorization header).
        Instead it's a signed, time-limited token embedding the user id, verified
        in CallbackView. See services.sign_connect_state.
      summary: Start connecting Google Calendar
      tags:
      - calendar
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectUrl'
          description: ''
  /api/v1/calendar/disconnect:
    post:
      operationId: calendar_disconnect_create
      summary: Disconnect Google Calendar
      tags:
      - calendar
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calendar/events:
    post:
      operationId: calendar_events_create
      summary: Book a one-off lesson
      tags:
      - calendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOffEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OneOffEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OneOffEventRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
          description: ''
        '400':
          description: Not connected to Google, or Google Calendar couldn't be reached.
  /api/v1/calendar/events/recurring:
    post:
      operationId: calendar_events_recurring_create
      description: Creates one recurring event per weekday in day_configs.
      summary: Book weekly lessons
      tags:
      - calendar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringEventsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecurringEventsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecurringEventsRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
          description: ''
        '400':
          description: Not connected to Google, or Google Calendar couldn't be reached.
  /api/v1/calendar/events/upcoming:
    get:
      operationId: calendar_events_upcoming_list
      summary: Upcoming Tutoring calendar events
      tags:
      - calendar
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
          description: ''
        '400':
          description: Not connected to Google, or Google Calendar couldn't be reached.
  /api/v1/calendar/sessions:
    get:
      operationId: calendar_sessions_retrieve
      description: 'The sessions page: calendar events and whether each has been logged.'
      summary: Tutoring calendar events with their logged status
      parameters:
      - in: query
        name: period
        schema:
          enum:
          - past
          - today
          - future
          - all
          type: string
          default: all
          minLength: 1
        description: |-
          * `past` - past
          * `today` - today
          * `future` - future
          * `all` - all
      - in: query
        name: q
        schema:
          type: string
          default: ''
        description: Filter by event title.
      - in: query
        name: status
        schema:
          enum:
          - all
          - logged
          - unlogged
          type: string
          default: all
          minLength: 1
        description: |-
          * `all` - all
          * `logged` - logged
          * `unlogged` - unlogged
      tags:
      - calendar
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSessions'
          description: ''
        '409':
          description: Google Calendar was never connected.
  /api/v1/calendar/status:
    get:
      operationId: calendar_status_retrieve
      summary: Whether Google Calendar is connected
      tags:
      - calendar
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatus'
          description: ''
  /api/v1/data/export:
    get:
      operationId: data_export_retrieve
      description: A JSON file (sent as an attachment) of your payees, students, sessions
        and payments.
      summary: Download all your data
      tags:
      - data
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/data/import:
    post:
      operationId: data_import_create
      description: Deletes your current payees, students, sessions and payments and
        loads the file's instead. Nothing changes if the file has any problem.
      summary: Replace all your data from an export file
      tags:
      - data
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataImportRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCounts'
          description: ''
        '400':
          description: Missing, too large or invalid file.
  /api/v1/payees/:
    get:
      operationId: payees_list
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Filter by payee name.
      tags:
      - payees
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payee'
          description: ''
    post:
      operationId: payees_create
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      tags:
      - payees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayeeRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
          description: ''
  /api/v1/payees/{id}/:
    get:
      operationId: payees_retrieve
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payee.
        required: true
      tags:
      - payees
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
          description: ''
    put:
      operationId: payees_update
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payee.
        required: true
      tags:
      - payees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayeeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayeeRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
          description: ''
    patch:
      operationId: payees_partial_update
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payee.
        required: true
      tags:
      - payees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPayeeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPayeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPayeeRequest'
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
          description: ''
    delete:
      operationId: payees_destroy
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payee.
        required: true
      tags:
      - payees
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/payees/{id}/balance/:
    get:
      operationId: payees_balance_retrieve
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payee.
        required: true
      tags:
      - payees
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
          description: ''
  /api/v1/payments/:
    get:
      operationId: payments_list
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: payee
        schema:
          type: string
          format: uuid
        description: Only this payee's payments.
      - in: query
        name: q
        schema:
          type: string
        description: Filter by payee name.
      tags:
      - payments
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
    post:
      operationId: payments_create
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/{id}/:
    get:
      operationId: payments_retrieve
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payment.
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    put:
      operationId: payments_update
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payment.
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    patch:
      operationId: payments_partial_update
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payment.
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequest'
      security:
      - jwtAuth: []
        cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    delete:
      operationId: payments_destroy
      description: |-
        For DRF viewsets: scope every query to the requesting user and stamp
        new rows with them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this payment.
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
        cookieAuth: []
