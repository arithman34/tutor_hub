<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutorHub</title>
    <!-- Apply the saved theme before React loads, so dark mode doesn't flash
         light first. Same localStorage key as the classic pages. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
