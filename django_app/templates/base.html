<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TutorHub{% endblock %}</title>
    {# Match the React app's theme (it stores the choice under the same key). #}
    <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <link rel="stylesheet" href="{{ static('css/app.css') }}" />
</head>
{# Page colours come from frontend/theme.css, shared with the React app. #}
<body>
    {% block content %}{% endblock %}
</body>
</html>
